{% extends "base.html" %}
{% block title %}CSRF - Change Email{% endblock %}

{% block content %}
<div class="container my-5">
    <h2><i class="bi bi-shuffle"></i> CSRF &raquo; Change Email</h2>
    <a href="/vuln/csrf/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to CSRF Lab</a>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="/vuln/csrf/change-email">
                <div class="mb-3">
                    <label for="new_email" class="form-label">New Email Address</label>
                    <input type="email" class="form-control" id="new_email" name="new_email" required>
                </div>
                <button type="submit" class="btn btn-danger">Update Email</button>
            </form>
        </div>
    </div>

    <div class="vuln-hint mt-3">
        <strong><i class="bi bi-lightbulb"></i> Vuln:</strong> No CSRF token, no email confirmation required. Attacker can change the victim's email and then perform account takeover via password reset.
    </div>
</div>
{% endblock %}
