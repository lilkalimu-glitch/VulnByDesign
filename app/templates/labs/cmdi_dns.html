{% extends "base.html" %}
{% block title %}Command Injection - DNS Lookup{% endblock %}

{% block content %}
<div class="container my-5">
    <h2><i class="bi bi-terminal"></i> CMDi &raquo; DNS Lookup</h2>
    <a href="/vuln/cmdi/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to CMDi Lab</a>

    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="/vuln/cmdi/dns">
                        <div class="input-group">
                            <input type="text" class="form-control" name="domain" placeholder="Enter domain" value="{{ domain or '' }}">
                            <button class="btn btn-danger" type="submit">Lookup</button>
                        </div>
                    </form>

                    {% if output %}
                    <div class="output-box mt-3">{{ output }}</div>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="vuln-hint">
                <strong><i class="bi bi-lightbulb"></i> Try:</strong>
                <ul class="small mb-0">
                    <li><code>example.com; ls -la</code></li>
                    <li><code>$(whoami).example.com</code></li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
