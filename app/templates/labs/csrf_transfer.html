{% extends "base.html" %}
{% block title %}CSRF - Fund Transfer{% endblock %}

{% block content %}
<div class="container my-5">
    <h2><i class="bi bi-shuffle"></i> CSRF &raquo; Fund Transfer</h2>
    <a href="/vuln/csrf/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to CSRF Lab</a>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="/vuln/csrf/transfer">
                <div class="mb-3">
                    <label for="recipient" class="form-label">Recipient Username</label>
                    <input type="text" class="form-control" id="recipient" name="recipient" required>
                </div>
                <div class="mb-3">
                    <label for="amount" class="form-label">Amount ($)</label>
                    <input type="number" class="form-control" id="amount" name="amount" min="1" required>
                </div>
                <button type="submit" class="btn btn-danger">Transfer Funds</button>
            </form>
        </div>
    </div>

    <div class="vuln-hint mt-3">
        <strong><i class="bi bi-lightbulb"></i> Vuln:</strong> Financial transaction with no CSRF protection. A hidden form on a malicious site could transfer funds without the user's knowledge.
    </div>
</div>
{% endblock %}
