{% extends "base.html" %}
{% block title %}Command Injection - Ping{% endblock %}

{% block content %}
<div class="container my-5">
    <h2><i class="bi bi-terminal"></i> CMDi &raquo; Ping</h2>
    <a href="/vuln/cmdi/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to CMDi Lab</a>

    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="/vuln/cmdi/ping">
                        <div class="input-group">
                            <input type="text" class="form-control" name="host" placeholder="Enter hostname or IP" value="{{ host or '' }}">
                            <button class="btn btn-danger" type="submit">Ping</button>
                        </div>
                    </form>

                    {% if output %}
                    <div class="output-box mt-3">{{ output }}</div>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="vuln-hint">
                <strong><i class="bi bi-lightbulb"></i> Try:</strong>
                <ul class="small mb-0">
                    <li><code>127.0.0.1; whoami</code></li>
                    <li><code>127.0.0.1 | cat /etc/passwd</code></li>
                    <li><code>127.0.0.1 && id</code></li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
