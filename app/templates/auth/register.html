{% extends "base.html" %}
{% block title %}Register - VulnByDesign{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Register</h3>
                    <form method="POST" action="/auth/register">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Create Account</button>
                    </form>
                    <hr>
                    <p class="text-center text-muted small mb-0">
                        Already have an account? <a href="/auth/login">Login here</a>
                    </p>
                </div>
            </div>
            <div class="vuln-hint mt-3">
                <strong><i class="bi bi-lightbulb"></i> Vuln:</strong> No password complexity requirements. Passwords stored in plaintext.
            </div>
        </div>
    </div>
</div>
{% endblock %}
